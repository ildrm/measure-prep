services:
  nginx:
    image: nginx:1.27-alpine
    depends_on: [web, api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
  mysql:
    ports: []
  redis:
    ports: []
  minio:
    ports: []
  mailpit:
    ports: []
  api:
    restart: unless-stopped
    environment:
      NODE_ENV: production
  web:
    restart: unless-stopped
    environment:
      NODE_ENV: production
