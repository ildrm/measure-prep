services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: examsim
      MYSQL_USER: examsim
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--schema", "/app/prisma/schema.prisma"]
    depends_on:
      mysql:
        condition: service_healthy
    env_file: ${APP_ENV_FILE:-../.env}
    restart: "no"

  seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["./node_modules/.bin/tsx", "prisma/seed.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    env_file: ${APP_ENV_FILE:-../.env}
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
      minio: { condition: service_started }
      mailpit: { condition: service_started }
    env_file: ${APP_ENV_FILE:-../.env}
    ports: ["3001:3001"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    depends_on: [api]
    env_file: ${APP_ENV_FILE:-../.env}
    ports: ["3000:3000"]

volumes:
  mysql_data:
  minio_data:
